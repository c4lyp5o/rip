[package]
name = "rip"
version = "1.0.0"
description = "REST In Peace — a native desktop HTTP/REST API client for sending requests, inspecting responses, and keeping history and collections locally."
authors = ["Calypso <calypso@calypsocloud.one>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/c4lyp5o/rip"
homepage = "https://github.com/c4lyp5o/rip#readme"
keywords = ["rest", "http", "api", "client", "tauri", "desktop"]
categories = ["development-tools::debugging"]
rust-version = "1.77.2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
