name: Bug report
description: Something in the app does not behave the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. If the app showed an error, the error panel
        holds the underlying cause — copying that saves a round trip.

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the app did instead.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the text from the app's error panel, if there was one.
      render: text

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, so someone else can follow them.
      render: text
