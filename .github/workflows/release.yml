name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sweep the history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # The action takes no `with:` inputs; it is configured through env.
          # Findings stay redacted in the log (the default) — this repo is public.
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; tauri-action then uploads latest.json,
          # the feed installed copies poll. Without these the build fails,
          # because tauri.conf.json sets bundle.createUpdaterArtifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "REST In Peace ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            **REST In Peace** — a native desktop HTTP/REST API client.

            Download the installer for your platform below. Everything the app
            stores stays on your machine, in a local SQLite database.

            The request and the response sit side by side, both always visible.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Portable build: the bare executable, no installer. It runs from any
      # folder; it needs the WebView2 runtime (built into Windows 10/11) and
      # keeps its data in %APPDATA%, like the installed app.
      - name: Upload portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          exe="src-tauri/target/release/REST In Peace.exe"
          [ -f "$exe" ] || exe="src-tauri/target/release/rip.exe"
          portable="REST-In-Peace_${TAG#v}_x64-portable.exe"
          cp "$exe" "$portable"
          gh release upload "$TAG" "$portable" --clobber
