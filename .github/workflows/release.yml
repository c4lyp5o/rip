name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
      android_only:
        description: "Only build Android and upload it to the tag's existing release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Once is enough: the history is the same on every runner, and the
      # action cannot install gitleaks on Windows (it fetches a .tar.gz that
      # does not exist for windows_x64 and 404s).
      - name: Sweep the history for credentials
        if: matrix.platform == 'ubuntu-22.04'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # The action takes no `with:` inputs; it is configured through env.
          # Findings stay redacted in the log (the default) — this repo is public.
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; tauri-action then uploads latest.json,
          # the feed installed copies poll. Without these the build fails,
          # because tauri.conf.json sets bundle.createUpdaterArtifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "REST In Peace ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            **REST In Peace** — a native desktop HTTP/REST API client.

            Download the installer for your platform below. Everything the app
            stores stays on your machine, in a local SQLite database.

            The request and the response sit side by side, both always visible.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Portable build: the bare executable, no installer. It runs from any
      # folder; it needs the WebView2 runtime (built into Windows 10/11) and
      # keeps its data in %APPDATA%, like the installed app.
      - name: Upload portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          exe="src-tauri/target/release/REST In Peace.exe"
          [ -f "$exe" ] || exe="src-tauri/target/release/rip.exe"
          portable="REST-In-Peace_${TAG#v}_x64-portable.exe"
          cp "$exe" "$portable"
          gh release upload "$TAG" "$portable" --clobber

  # Android: a universal APK for sideloading and an AAB for the Play Store,
  # both signed with the upload key. Runs after the desktop matrix so the
  # draft release it uploads to already exists.
  #
  # With android_only, the desktop matrix is skipped and this job builds the
  # tag's code on its own: a way to redo a failed Android build without
  # rebuilding (and re-uploading) every desktop installer.
  android:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.android_only && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which the
          # SDK repository no longer serves, and the step fails on it.
          packages: platform-tools

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The keystore arrives base64-encoded; build.gradle.kts reads the
      # properties file named by RIP_KEYSTORE_PROPERTIES. Both live in
      # $RUNNER_TEMP, outside the checkout.
      - name: Write the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; the Android build would be unsigned"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > "$RUNNER_TEMP/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "RIP_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        run: bun tauri android build --apk --aab

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          out=src-tauri/gen/android/app/build/outputs
          apk="REST-In-Peace_${TAG#v}_android-universal.apk"
          aab="REST-In-Peace_${TAG#v}_android-universal.aab"
          cp "$out/apk/universal/release/app-universal-release.apk" "$apk"
          cp "$out/bundle/universalRelease/app-universal-release.aab" "$aab"
          gh release upload "$TAG" "$apk" "$aab" --clobber
